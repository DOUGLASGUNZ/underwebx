name: Publish UnderWeb X Release

on:
  workflow_run:
    workflows:
      - Build UnderWeb X
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main-branch Build UnderWeb X run ID to publish
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  release:
    if: >-
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Resolve and validate build metadata
        id: meta
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          MANUAL_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            run_id="$WORKFLOW_RUN_ID"
            head_sha="$WORKFLOW_HEAD_SHA"
          else
            run_id="$MANUAL_RUN_ID"
            run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            run_name="$(jq -r '.name' <<< "$run_json")"
            conclusion="$(jq -r '.conclusion' <<< "$run_json")"
            event_name="$(jq -r '.event' <<< "$run_json")"
            head_branch="$(jq -r '.head_branch' <<< "$run_json")"
            head_repo="$(jq -r '.head_repository.full_name' <<< "$run_json")"
            head_sha="$(jq -r '.head_sha' <<< "$run_json")"

            if [[ "$run_name" != "Build UnderWeb X" || "$conclusion" != "success" || "$event_name" != "push" || "$head_branch" != "main" || "$head_repo" != "$GITHUB_REPOSITORY" ]]; then
              echo "Run $run_id is not a trusted successful main-branch Build UnderWeb X push run." >&2
              exit 1
            fi
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Checkout exact built commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.head_sha }}

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          marker="features/release/RELEASE_VERSION"
          if [[ ! -f "$marker" ]]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Built commit predates the release marker; skipping publication."
            exit 0
          fi

          version="$(tr -d '[:space:]' < "$marker")"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        if: steps.version.outputs.eligible == 'true'
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; nothing to publish."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download validated Windows artifact
        if: steps.version.outputs.eligible == 'true' && steps.existing.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          name: UnderWebX-Windows
          path: release-assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.meta.outputs.run_id }}

      - name: Validate release payload
        if: steps.version.outputs.eligible == 'true' && steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -maxdepth 2 -type f -print
          test -n "$(find release-assets -type f -name 'UnderWebX_*_Setup.exe' -print -quit)"
          test -n "$(find release-assets -type f -name 'UnderWebX_*.zip' -print -quit)"
          test -n "$(find release-assets -type f -name 'SHA256SUMS.txt' -print -quit)"

      - name: Publish permanent GitHub Release
        if: steps.version.outputs.eligible == 'true' && steps.existing.outputs.exists != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          HEAD_SHA: ${{ steps.meta.outputs.head_sha }}
        run: |
          set -euo pipefail
          mapfile -d '' assets < <(find release-assets -type f \( -name 'UnderWebX_*_Setup.exe' -o -name 'UnderWebX_*.zip' -o -name 'SHA256SUMS.txt' \) -print0)
          if (( ${#assets[@]} < 3 )); then
            echo "Expected installer, portable ZIP, and checksum file before release." >&2
            exit 1
          fi

          gh release create "$TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$HEAD_SHA" \
            --title "UnderWeb X $TAG" \
            --generate-notes \
            --latest
