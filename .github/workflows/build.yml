name: Build UnderWeb X

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "UnderWebX*-source.zip"
      - "base-patch/**"
      - "launch-patch/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Ensure npm requirement
        shell: pwsh
        run: npm install -g npm@11.5.0

      - name: Install NSIS and 7-Zip
        shell: pwsh
        run: |
          choco install nsis 7zip -y --no-progress
          "C:\Program Files\7-Zip" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Locate or extract UWX source
        shell: pwsh
        run: |
          if (Test-Path ".\package.json") {
            "UWX_SOURCE=$((Resolve-Path '.').Path)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            exit 0
          }

          $zip = Get-Item ".\UnderWebX-v0.2.0-source.zip" -ErrorAction Stop
          Write-Host "Using pinned base source: $($zip.Name)"

          New-Item -ItemType Directory -Path uwx-src -Force | Out-Null
          Expand-Archive -Path $zip.FullName -DestinationPath uwx-src -Force

          $root = Get-ChildItem -Path uwx-src -Directory | Where-Object {
            Test-Path (Join-Path $_.FullName "package.json")
          } | Select-Object -First 1

          if (-not $root) {
            throw "Could not find an extracted UWX source folder containing package.json."
          }

          "UWX_SOURCE=$($root.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Apply missing v0.3 base patch
        shell: pwsh
        run: |
          $parts = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\base-patch" -Filter "part-*.patch" | Sort-Object Name
          if (-not $parts) {
            throw "Base patch parts were not found."
          }

          $patchFile = Join-Path $env:GITHUB_WORKSPACE "uwx-base.patch"
          if (Test-Path $patchFile) { Remove-Item $patchFile -Force }

          $out = [System.IO.File]::OpenWrite($patchFile)
          try {
            foreach ($part in $parts) {
              $bytes = [System.IO.File]::ReadAllBytes($part.FullName)
              $out.Write($bytes, 0, $bytes.Length)
            }
          } finally {
            $out.Dispose()
          }

          Push-Location $env:UWX_SOURCE
          git apply --whitespace=nowarn $patchFile
          $baseVersion = (Get-Content .\UWX_VERSION -Raw).Trim()
          if ($baseVersion -ne "0.3.0") {
            throw "Base patch did not produce UWX 0.3.0; got '$baseVersion'."
          }
          Write-Host "Base patch OK: UWX $baseVersion"
          Pop-Location

      - name: Apply UWX launch patch
        shell: pwsh
        run: |
          $parts = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\launch-patch" -Filter "part-*.patch" | Sort-Object Name
          if (-not $parts) {
            throw "Launch patch parts were not found."
          }

          $patchFile = Join-Path $env:GITHUB_WORKSPACE "uwx-launch.patch"
          if (Test-Path $patchFile) { Remove-Item $patchFile -Force }

          $out = [System.IO.File]::OpenWrite($patchFile)
          try {
            foreach ($part in $parts) {
              $bytes = [System.IO.File]::ReadAllBytes($part.FullName)
              $out.Write($bytes, 0, $bytes.Length)
            }
          } finally {
            $out.Dispose()
          }

          Push-Location $env:UWX_SOURCE
          git apply --whitespace=nowarn $patchFile
          $finalVersion = (Get-Content .\UWX_VERSION -Raw).Trim()
          if ($finalVersion -ne "0.4.1-rc1") {
            throw "Launch patch did not produce UWX 0.4.1-rc1; got '$finalVersion'."
          }
          Write-Host "Launch patch OK: UWX $finalVersion"
          Pop-Location

      - name: Verify RC1 UI is present
        shell: pwsh
        run: |
          $view = Join-Path $env:UWX_SOURCE "src\views\UnderWeb\UnderWeb.vue"
          $text = Get-Content $view -Raw
          $required = @(
            "uwx-panel-tabs",
            "GROUP RECRUITER",
            "OSC Lab",
            "Connected Accounts",
            "Event Mode"
          )
          foreach ($needle in $required) {
            if (-not $text.Contains($needle)) {
              throw "RC1 UI verification failed: missing '$needle'."
            }
          }
          Write-Host "RC1 UI verification passed."

      - name: Verify build tools
        shell: pwsh
        run: |
          node --version
          npm --version
          dotnet --version
          7z | Select-Object -First 2
          $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) {
            throw "NSIS was not found at $nsis"
          }

      - name: Build UnderWeb X
        shell: pwsh
        working-directory: ${{ env.UWX_SOURCE }}
        run: pwsh ./build-scripts/build-all.ps1

      - name: Upload UnderWeb X builds
        uses: actions/upload-artifact@v4
        with:
          name: UnderWebX-Windows
          path: |
            ${{ env.UWX_SOURCE }}/UnderWebX_*_Setup.exe
            ${{ env.UWX_SOURCE }}/UnderWebX_*.zip
            ${{ env.UWX_SOURCE }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
