name: Build UnderWeb X

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "UnderWebX*-source.zip"
      - "full-patch/**"
      - "osc-upgrade/**"
      - "polish/**"
      - "features/**"
      - ".github/workflows/build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "UnderWebX*-source.zip"
      - "full-patch/**"
      - "osc-upgrade/**"
      - "polish/**"
      - "features/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Ensure npm requirement
        shell: pwsh
        run: npm install -g npm@11.5.0

      - name: Install NSIS and 7-Zip
        shell: pwsh
        run: |
          choco install nsis 7zip -y --no-progress
          "C:\Program Files\7-Zip" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Extract pinned UWX v0.2 source
        shell: pwsh
        run: |
          $zip = Get-Item ".\UnderWebX-v0.2.0-source.zip" -ErrorAction Stop
          Write-Host "Using pinned base source: $($zip.Name)"

          if (Test-Path ".\uwx-src") { Remove-Item ".\uwx-src" -Recurse -Force }
          New-Item -ItemType Directory -Path uwx-src -Force | Out-Null
          Expand-Archive -Path $zip.FullName -DestinationPath uwx-src -Force

          $root = Get-ChildItem -Path uwx-src -Directory | Where-Object {
            Test-Path (Join-Path $_.FullName "package.json")
          } | Select-Object -First 1

          if (-not $root) {
            throw "Could not find an extracted UWX source folder containing package.json."
          }

          "UWX_SOURCE=$($root.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload pinned base source for diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: UWX-Pinned-Base-Source
          path: UnderWebX-v0.2.0-source.zip
          retention-days: 2

      - name: Apply validated full RC1 patch
        shell: pwsh
        run: |
          $parts = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\full-patch" -Filter "part-*.patch" | Sort-Object Name
          if (-not $parts) {
            throw "Full RC1 patch parts were not found."
          }

          $patchFile = Join-Path $env:GITHUB_WORKSPACE "uwx-full-rc1.patch"
          if (Test-Path $patchFile) { Remove-Item $patchFile -Force }

          $out = [System.IO.File]::OpenWrite($patchFile)
          try {
            foreach ($part in $parts) {
              $bytes = [System.IO.File]::ReadAllBytes($part.FullName)
              $out.Write($bytes, 0, $bytes.Length)
            }
          } finally {
            $out.Dispose()
          }

          # Windows checkout converts text patch parts to CRLF. Normalize the
          # assembled patch back to LF so git apply matches the source archive.
          $patchText = [System.IO.File]::ReadAllText($patchFile).Replace("`r`n", "`n")
          [System.IO.File]::WriteAllText(
            $patchFile,
            $patchText,
            (New-Object System.Text.UTF8Encoding($false))
          )

          Push-Location $env:UWX_SOURCE
          git init -q
          $diag = Join-Path $env:GITHUB_WORKSPACE "patch-diagnostics.txt"
          "UWX_SOURCE=$env:UWX_SOURCE" | Out-File $diag -Encoding utf8
          "VERSION_BEFORE=$((Get-Content .\UWX_VERSION -Raw).Trim())" | Out-File $diag -Append -Encoding utf8
          "PATCH_BYTES=$((Get-Item $patchFile).Length)" | Out-File $diag -Append -Encoding utf8
          git apply --check --verbose $patchFile 2>&1 | Tee-Object -FilePath $diag -Append
          if ($LASTEXITCODE -ne 0) {
            Pop-Location
            throw "git apply --check failed; see patch-diagnostics artifact."
          }
          git apply --whitespace=nowarn $patchFile 2>&1 | Tee-Object -FilePath $diag -Append
          if ($LASTEXITCODE -ne 0) {
            Pop-Location
            throw "git apply failed; see patch-diagnostics artifact."
          }
          $version = (Get-Content .\UWX_VERSION -Raw).Trim()
          if ($version -ne "0.4.1-rc1") {
            throw "Full patch did not produce UWX 0.4.1-rc1; got '$version'."
          }
          Write-Host "Validated full patch applied: UWX $version"
          Pop-Location

      - name: Apply OSC live status upgrade
        shell: pwsh
        run: |
          $patchFile = Join-Path $env:GITHUB_WORKSPACE "osc-upgrade\rc2.patch"
          if (-not (Test-Path $patchFile)) {
            throw "OSC upgrade patch not found."
          }

          $patchText = [System.IO.File]::ReadAllText($patchFile).Replace("`r`n", "`n")
          [System.IO.File]::WriteAllText(
            $patchFile,
            $patchText,
            (New-Object System.Text.UTF8Encoding($false))
          )

          Push-Location $env:UWX_SOURCE
          $oscDiag = Join-Path $env:GITHUB_WORKSPACE "osc-patch-diagnostics.txt"
          "VERSION_BEFORE=$((Get-Content .\UWX_VERSION -Raw).Trim())" | Out-File $oscDiag -Encoding utf8
          git apply --check --verbose $patchFile 2>&1 | Tee-Object -FilePath $oscDiag -Append
          if ($LASTEXITCODE -ne 0) {
            Pop-Location
            throw "OSC upgrade patch check failed."
          }
          git apply --whitespace=nowarn $patchFile 2>&1 | Tee-Object -FilePath $oscDiag -Append
          if ($LASTEXITCODE -ne 0) {
            Pop-Location
            throw "OSC upgrade patch failed."
          }
          $version = (Get-Content .\UWX_VERSION -Raw).Trim()
          if ($version -ne "0.4.2-rc2") {
            Pop-Location
            throw "OSC upgrade did not produce UWX 0.4.2-rc2; got '$version'."
          }
          Write-Host "OSC upgrade applied: UWX $version"
          Pop-Location

      - name: Apply UWX chatbox signature upgrade
        shell: pwsh
        run: |
          $patchFile = Join-Path $env:GITHUB_WORKSPACE "osc-upgrade\rc3-signature.patch"
          if (-not (Test-Path $patchFile)) {
            throw "UWX signature patch not found."
          }

          $patchText = [System.IO.File]::ReadAllText($patchFile).Replace("`r`n", "`n")
          [System.IO.File]::WriteAllText(
            $patchFile,
            $patchText,
            (New-Object System.Text.UTF8Encoding($false))
          )

          Push-Location $env:UWX_SOURCE
          $sigDiag = Join-Path $env:GITHUB_WORKSPACE "signature-patch-diagnostics.txt"
          "VERSION_BEFORE=$((Get-Content .\UWX_VERSION -Raw).Trim())" | Out-File $sigDiag -Encoding utf8
          git apply --check --verbose $patchFile 2>&1 | Tee-Object -FilePath $sigDiag -Append
          if ($LASTEXITCODE -ne 0) {
            Pop-Location
            throw "UWX signature patch check failed."
          }
          git apply --whitespace=nowarn $patchFile 2>&1 | Tee-Object -FilePath $sigDiag -Append
          if ($LASTEXITCODE -ne 0) {
            Pop-Location
            throw "UWX signature patch failed."
          }
          $version = (Get-Content .\UWX_VERSION -Raw).Trim()
          if ($version -ne "0.4.3-rc3") {
            Pop-Location
            throw "Signature upgrade did not produce UWX 0.4.3-rc3; got '$version'."
          }
          Write-Host "UWX signature upgrade applied: UWX $version"
          Pop-Location

      - name: Apply live media timeline upgrade
        shell: pwsh
        run: |
          $patchFile = Join-Path $env:GITHUB_WORKSPACE "osc-upgrade\rc4-timeline.patch"
          if (-not (Test-Path $patchFile)) {
            throw "RC4 media timeline patch not found."
          }

          $patchText = [System.IO.File]::ReadAllText($patchFile).Replace("`r`n", "`n")
          [System.IO.File]::WriteAllText(
            $patchFile,
            $patchText,
            (New-Object System.Text.UTF8Encoding($false))
          )

          Push-Location $env:UWX_SOURCE
          $timelineDiag = Join-Path $env:GITHUB_WORKSPACE "timeline-patch-diagnostics.txt"
          "VERSION_BEFORE=$((Get-Content .\UWX_VERSION -Raw).Trim())" | Out-File $timelineDiag -Encoding utf8
          git apply --check --verbose $patchFile 2>&1 | Tee-Object -FilePath $timelineDiag -Append
          if ($LASTEXITCODE -ne 0) {
            Pop-Location
            throw "RC4 media timeline patch check failed."
          }
          git apply --whitespace=nowarn $patchFile 2>&1 | Tee-Object -FilePath $timelineDiag -Append
          if ($LASTEXITCODE -ne 0) {
            Pop-Location
            throw "RC4 media timeline patch failed."
          }
          $version = (Get-Content .\UWX_VERSION -Raw).Trim()
          if ($version -ne "0.4.4-rc4") {
            Pop-Location
            throw "Timeline upgrade did not produce UWX 0.4.4-rc4; got '$version'."
          }
          Write-Host "Live media timeline upgrade applied: UWX $version"
          Pop-Location

      - name: Upload RC4 patched source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: UWX-RC4-Source-Snapshot
          path: |
            ${{ env.UWX_SOURCE }}/src/stores/oscLab.js
            ${{ env.UWX_SOURCE }}/src/views/UnderWeb/UnderWeb.vue
            ${{ env.UWX_SOURCE }}/UWX_VERSION
            ${{ env.UWX_SOURCE }}/CHANGELOG_UWX.md
          retention-days: 2

      - name: Apply premium OSC Lab redesign
        shell: pwsh
        run: |
          $patchFile = Join-Path $env:GITHUB_WORKSPACE "osc-upgrade\rc6-premium.patch"
          if (-not (Test-Path $patchFile)) {
            throw "RC6 premium OSC patch not found."
          }

          # Normalize the RC6 patch and only the files it touches to LF so the
          # diff applies deterministically after the RC4 Windows build steps.
          $patchText = [System.IO.File]::ReadAllText($patchFile).Replace("`r`n", "`n")
          [System.IO.File]::WriteAllText(
            $patchFile,
            $patchText,
            (New-Object System.Text.UTF8Encoding($false))
          )

          $targets = @(
            "CHANGELOG_UWX.md",
            "UWX_VERSION",
            "src\stores\oscLab.js",
            "src\views\UnderWeb\UnderWeb.vue",
            "src\shared\constants\uwx.js"
          )
          foreach ($relative in $targets) {
            $target = Join-Path $env:UWX_SOURCE $relative
            if (-not (Test-Path $target)) {
              throw "RC6 target file missing: $relative"
            }
            $text = [System.IO.File]::ReadAllText($target).Replace("`r`n", "`n")
            [System.IO.File]::WriteAllText(
              $target,
              $text,
              (New-Object System.Text.UTF8Encoding($false))
            )
          }

          Push-Location $env:UWX_SOURCE
          $premiumDiag = Join-Path $env:GITHUB_WORKSPACE "premium-patch-diagnostics.txt"
          "VERSION_BEFORE=$((Get-Content .\UWX_VERSION -Raw).Trim())" | Out-File $premiumDiag -Encoding utf8
          git apply --check --verbose $patchFile 2>&1 | Tee-Object -FilePath $premiumDiag -Append
          if ($LASTEXITCODE -ne 0) {
            Pop-Location
            throw "RC6 premium OSC patch check failed."
          }
          git apply --whitespace=nowarn $patchFile 2>&1 | Tee-Object -FilePath $premiumDiag -Append
          if ($LASTEXITCODE -ne 0) {
            Pop-Location
            throw "RC6 premium OSC patch failed."
          }
          $version = (Get-Content .\UWX_VERSION -Raw).Trim()
          if ($version -ne "0.4.6-rc6") {
            Pop-Location
            throw "Premium OSC redesign did not produce UWX 0.4.6-rc6; got '$version'."
          }
          Write-Host "Premium OSC Lab redesign applied: UWX $version"
          Pop-Location

      - name: Verify RC6 premium UI is present
        shell: pwsh
        run: |
          $view = Join-Path $env:UWX_SOURCE "src\views\UnderWeb\UnderWeb.vue"
          $text = Get-Content $view -Raw
          $required = @(
            "uwx-panel-tabs",
            "GROUP RECRUITER",
            "OSC Lab",
            "Connected Accounts",
            "Event Mode",
            "Broadcast Control",
            "Live Status Builder",
            "Live Preview",
            "Presets",
            "Output Log",
            "VRChat OSC",
            "Spotify / Media",
            "Keep visible",
            "Auto-detect Windows media",
            "UWX signature"
          )
          foreach ($needle in $required) {
            if (-not $text.Contains($needle)) {
              throw "RC6 UI verification failed: missing '$needle'."
            }
          }
          if ($text.Contains("AVATAR PARAMETER TEST")) {
            throw "RC6 UI verification failed: avatar parameter tester is still visible."
          }
          Write-Host "RC6 premium UI verification passed."

      - name: Apply RC7 premium interface polish
        shell: pwsh
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE "polish\apply-rc7.mjs"
          $css = Join-Path $env:GITHUB_WORKSPACE "polish\rc7-premium.css"
          if (-not (Test-Path $script)) { throw "RC7 polish applicator missing." }
          if (-not (Test-Path $css)) { throw "RC7 premium stylesheet missing." }

          node $script $env:UWX_SOURCE $css
          if ($LASTEXITCODE -ne 0) {
            throw "RC7 premium polish applicator failed."
          }

      - name: Verify RC7 premium interface polish
        shell: pwsh
        run: |
          $version = (Get-Content (Join-Path $env:UWX_SOURCE "UWX_VERSION") -Raw).Trim()
          if ($version -ne "0.4.7-rc7") {
            throw "RC7 polish did not produce UWX 0.4.7-rc7; got '$version'."
          }

          $app = Get-Content (Join-Path $env:UWX_SOURCE "src\App.vue") -Raw
          $card = Get-Content (Join-Path $env:UWX_SOURCE "src\components\ui\card\Card.vue") -Raw
          $empty = Get-Content (Join-Path $env:UWX_SOURCE "src\components\ui\empty\Empty.vue") -Raw
          $skeleton = Get-Content (Join-Path $env:UWX_SOURCE "src\components\ui\skeleton\Skeleton.vue") -Raw
          $sonner = Get-Content (Join-Path $env:UWX_SOURCE "src\components\ui\sonner\Sonner.vue") -Raw
          $styles = Get-Content (Join-Path $env:UWX_SOURCE "src\styles\uwx-premium.css") -Raw

          $checks = @(
            @{ Text = $app; Needle = "uwx-premium.css" },
            @{ Text = $card; Needle = "uwx-premium-card" },
            @{ Text = $empty; Needle = "uwx-empty-state" },
            @{ Text = $skeleton; Needle = "uwx-skeleton" },
            @{ Text = $sonner; Needle = "uwx-toaster" },
            @{ Text = $styles; Needle = "UWX_RC7_PREMIUM_POLISH" },
            @{ Text = $styles; Needle = "sidebar-menu-button" },
            @{ Text = $styles; Needle = "uwx-shimmer" },
            @{ Text = $styles; Needle = "data-sonner-toast" }
          )
          foreach ($check in $checks) {
            if (-not $check.Text.Contains($check.Needle)) {
              throw "RC7 premium interface verification failed: missing '$($check.Needle)'."
            }
          }
          Write-Host "RC7 premium interface verification passed."

      - name: Apply RC8 Safety Intel
        shell: pwsh
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE "features\safety-intel\apply-rc8.mjs"
          $store = Join-Path $env:GITHUB_WORKSPACE "features\safety-intel\safetyIntel.js"
          $css = Join-Path $env:GITHUB_WORKSPACE "features\safety-intel\safety-intel.css"
          if (-not (Test-Path $script)) { throw "RC8 Safety Intel applicator missing." }
          if (-not (Test-Path $store)) { throw "RC8 Safety Intel store missing." }
          if (-not (Test-Path $css)) { throw "RC8 Safety Intel stylesheet missing." }

          node $script $env:UWX_SOURCE $store $css
          if ($LASTEXITCODE -ne 0) {
            throw "RC8 Safety Intel applicator failed."
          }

      - name: Verify RC8 Safety Intel
        shell: pwsh
        run: |
          $version = (Get-Content (Join-Path $env:UWX_SOURCE "UWX_VERSION") -Raw).Trim()
          if ($version -ne "0.4.8-rc8") {
            throw "RC8 Safety Intel did not produce UWX 0.4.8-rc8; got '$version'."
          }

          $view = Get-Content (Join-Path $env:UWX_SOURCE "src\views\UnderWeb\UnderWeb.vue") -Raw
          $store = Get-Content (Join-Path $env:UWX_SOURCE "src\stores\safetyIntel.js") -Raw
          $styles = Get-Content (Join-Path $env:UWX_SOURCE "src\styles\uwx-safety-intel.css") -Raw

          $required = @(
            "Safety Intel",
            "Community Safety Network",
            "NO AUTO-ENFORCEMENT",
            "Scan instance",
            "VRChat User Lookup",
            "No reviewed Safety Intel record found",
            "selectedSafetyIntel",
            "scanSafetyCurrentInstance"
          )
          foreach ($needle in $required) {
            if (-not $view.Contains($needle)) {
              throw "RC8 Safety Intel verification failed: missing '$needle'."
            }
          }
          if (-not $store.Contains("uwx_safety_subjects")) {
            throw "RC8 Safety Intel store verification failed."
          }
          if (-not $styles.Contains("UWX_RC8_SAFETY_INTEL")) {
            throw "RC8 Safety Intel stylesheet verification failed."
          }
          Write-Host "RC8 Safety Intel verification passed."

      - name: Verify build tools
        shell: pwsh
        run: |
          node --version
          npm --version
          dotnet --version
          7z | Select-Object -First 2
          $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) {
            throw "NSIS was not found at $nsis"
          }

      - name: Apply RC9 private Safety Intel reporting
        shell: pwsh
        run: |
          $base = Join-Path $env:GITHUB_WORKSPACE "features\safety-intel"
          $script = Join-Path $base "apply-rc9.mjs"
          $store = Join-Path $base "safetyReporting.js"
          $card = Join-Path $base "reporting-card.vuefrag"
          $css = Join-Path $base "safety-intel.css"
          node $script $env:UWX_SOURCE $store $card $css
          if ($LASTEXITCODE -ne 0) { throw "RC9 reporting applicator failed." }
          $version = (Get-Content (Join-Path $env:UWX_SOURCE "UWX_VERSION") -Raw).Trim()
          if ($version -ne "0.4.9-rc9") { throw "RC9 version mismatch: $version" }

      - name: Apply OSC Lab 2.0 core
        shell: pwsh
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE "osc-upgrade\apply-osc2.mjs"
          if (-not (Test-Path $script)) { throw "OSC2 core applicator missing." }
          node $script $env:UWX_SOURCE
          if ($LASTEXITCODE -ne 0) { throw "OSC2 core applicator failed." }

      - name: Apply OSC Lab 2.0 interface
        shell: pwsh
        run: |
          $script = Join-Path $env:GITHUB_WORKSPACE "osc-upgrade\apply-osc2-ui.mjs"
          if (-not (Test-Path $script)) { throw "OSC2 UI applicator missing." }
          node $script $env:UWX_SOURCE
          if ($LASTEXITCODE -ne 0) { throw "OSC2 UI applicator failed." }

      - name: Verify OSC Lab 2.0
        shell: pwsh
        run: |
          $version = (Get-Content (Join-Path $env:UWX_SOURCE "UWX_VERSION") -Raw).Trim()
          if ($version -ne "0.5.0-osc2") { throw "OSC2 version mismatch: $version" }
          $view = Get-Content (Join-Path $env:UWX_SOURCE "src\views\UnderWeb\UnderWeb.vue") -Raw
          $store = Get-Content (Join-Path $env:UWX_SOURCE "src\stores\oscLab.js") -Raw
          foreach ($needle in @("Current Screen","Screen Queue","Status Pool","Smart Interrupts","HIDE")) {
            if (-not $view.Contains($needle)) { throw "OSC2 UI verification failed: missing '$needle'." }
          }
          foreach ($needle in @("osc2SetMode","sendOsc2Current","OSC2_QUEUE","validateOsc2Text")) {
            if (-not $store.Contains($needle)) { throw "OSC2 core verification failed: missing '$needle'." }
          }
          Write-Host "OSC Lab 2.0 verification passed."

      - name: Build UnderWeb X
        shell: pwsh
        working-directory: ${{ env.UWX_SOURCE }}
        run: pwsh ./build-scripts/build-all.ps1

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UWX-Patch-Diagnostics
          path: |
            patch-diagnostics.txt
            osc-patch-diagnostics.txt
            signature-patch-diagnostics.txt
            timeline-patch-diagnostics.txt
            premium-patch-diagnostics.txt
          if-no-files-found: ignore
          retention-days: 2

      - name: Upload UnderWeb X builds
        uses: actions/upload-artifact@v4
        with:
          name: UnderWebX-Windows
          path: |
            ${{ env.UWX_SOURCE }}/UnderWebX_*_Setup.exe
            ${{ env.UWX_SOURCE }}/UnderWebX_*.zip
            ${{ env.UWX_SOURCE }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
