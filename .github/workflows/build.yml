name: Build UnderWeb X

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "UnderWebX*-source.zip"
      - "full-patch/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Ensure npm requirement
        shell: pwsh
        run: npm install -g npm@11.5.0

      - name: Install NSIS and 7-Zip
        shell: pwsh
        run: |
          choco install nsis 7zip -y --no-progress
          "C:\Program Files\7-Zip" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Extract pinned UWX v0.2 source
        shell: pwsh
        run: |
          $zip = Get-Item ".\UnderWebX-v0.2.0-source.zip" -ErrorAction Stop
          Write-Host "Using pinned base source: $($zip.Name)"

          if (Test-Path ".\uwx-src") { Remove-Item ".\uwx-src" -Recurse -Force }
          New-Item -ItemType Directory -Path uwx-src -Force | Out-Null
          Expand-Archive -Path $zip.FullName -DestinationPath uwx-src -Force

          $root = Get-ChildItem -Path uwx-src -Directory | Where-Object {
            Test-Path (Join-Path $_.FullName "package.json")
          } | Select-Object -First 1

          if (-not $root) {
            throw "Could not find an extracted UWX source folder containing package.json."
          }

          "UWX_SOURCE=$($root.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload pinned base source for diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: UWX-Pinned-Base-Source
          path: UnderWebX-v0.2.0-source.zip
          retention-days: 2

      - name: Apply validated full RC1 patch
        shell: pwsh
        run: |
          $parts = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\full-patch" -Filter "part-*.patch" | Sort-Object Name
          if (-not $parts) {
            throw "Full RC1 patch parts were not found."
          }

          $patchFile = Join-Path $env:GITHUB_WORKSPACE "uwx-full-rc1.patch"
          if (Test-Path $patchFile) { Remove-Item $patchFile -Force }

          $out = [System.IO.File]::OpenWrite($patchFile)
          try {
            foreach ($part in $parts) {
              $bytes = [System.IO.File]::ReadAllBytes($part.FullName)
              $out.Write($bytes, 0, $bytes.Length)
            }
          } finally {
            $out.Dispose()
          }

          # Windows checkout converts text patch parts to CRLF. Normalize the
          # assembled patch back to LF so git apply matches the source archive.
          $patchText = [System.IO.File]::ReadAllText($patchFile).Replace("`r`n", "`n")
          [System.IO.File]::WriteAllText(
            $patchFile,
            $patchText,
            (New-Object System.Text.UTF8Encoding($false))
          )

          Push-Location $env:UWX_SOURCE
          git init -q
          $diag = Join-Path $env:GITHUB_WORKSPACE "patch-diagnostics.txt"
          "UWX_SOURCE=$env:UWX_SOURCE" | Out-File $diag -Encoding utf8
          "VERSION_BEFORE=$((Get-Content .\UWX_VERSION -Raw).Trim())" | Out-File $diag -Append -Encoding utf8
          "PATCH_BYTES=$((Get-Item $patchFile).Length)" | Out-File $diag -Append -Encoding utf8
          git apply --check --verbose $patchFile 2>&1 | Tee-Object -FilePath $diag -Append
          if ($LASTEXITCODE -ne 0) {
            Pop-Location
            throw "git apply --check failed; see patch-diagnostics artifact."
          }
          git apply --whitespace=nowarn $patchFile 2>&1 | Tee-Object -FilePath $diag -Append
          if ($LASTEXITCODE -ne 0) {
            Pop-Location
            throw "git apply failed; see patch-diagnostics artifact."
          }
          $version = (Get-Content .\UWX_VERSION -Raw).Trim()
          if ($version -ne "0.4.1-rc1") {
            throw "Full patch did not produce UWX 0.4.1-rc1; got '$version'."
          }
          Write-Host "Validated full patch applied: UWX $version"
          Pop-Location

      - name: Verify RC1 UI is present
        shell: pwsh
        run: |
          $view = Join-Path $env:UWX_SOURCE "src\views\UnderWeb\UnderWeb.vue"
          $text = Get-Content $view -Raw
          $required = @(
            "uwx-panel-tabs",
            "GROUP RECRUITER",
            "OSC Lab",
            "Connected Accounts",
            "Event Mode"
          )
          foreach ($needle in $required) {
            if (-not $text.Contains($needle)) {
              throw "RC1 UI verification failed: missing '$needle'."
            }
          }
          Write-Host "RC1 UI verification passed."

      - name: Verify build tools
        shell: pwsh
        run: |
          node --version
          npm --version
          dotnet --version
          7z | Select-Object -First 2
          $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) {
            throw "NSIS was not found at $nsis"
          }

      - name: Build UnderWeb X
        shell: pwsh
        working-directory: ${{ env.UWX_SOURCE }}
        run: pwsh ./build-scripts/build-all.ps1

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UWX-Patch-Diagnostics
          path: patch-diagnostics.txt
          if-no-files-found: ignore
          retention-days: 2

      - name: Upload UnderWeb X builds
        uses: actions/upload-artifact@v4
        with:
          name: UnderWebX-Windows
          path: |
            ${{ env.UWX_SOURCE }}/UnderWebX_*_Setup.exe
            ${{ env.UWX_SOURCE }}/UnderWebX_*.zip
            ${{ env.UWX_SOURCE }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
