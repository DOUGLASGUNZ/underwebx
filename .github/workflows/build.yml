      - name: Build UnderWeb X
        shell: pwsh
        working-directory: ${{ env.UWX_SOURCE }}
        run: pwsh ./build-scripts/build-all.ps1

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: UWX-Patch-Diagnostics
          path: |
            patch-diagnostics.txt
            osc-patch-diagnostics.txt
            signature-patch-diagnostics.txt
            timeline-patch-diagnostics.txt
            premium-patch-diagnostics.txt
          if-no-files-found: ignore
          retention-days: 2

      - name: Upload UnderWeb X builds
        uses: actions/upload-artifact@v4
        with:
          name: UnderWebX-Windows
          path: |
            ${{ env.UWX_SOURCE }}/UnderWebX_*_Setup.exe
            ${{ env.UWX_SOURCE }}/UnderWebX_*.zip
            ${{ env.UWX_SOURCE }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        if: github.event_name == 'workflow_dispatch' && inputs.publish != 'none'
        shell: pwsh
        working-directory: ${{ env.UWX_SOURCE }}
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.publish }}
        run: |
          $version = (Get-Content "UWX_VERSION" -Raw).Trim()
          $tag = "v$version"
          $setup = Get-ChildItem -Path . -Filter "UnderWebX_*_Setup.exe" | Select-Object -First 1
          $zip = Get-ChildItem -Path . -Filter "UnderWebX_*.zip" | Select-Object -First 1
          if (-not $setup) { throw "No installer to publish." }
          if ($env:CHANNEL -eq "stable" -and $version -match "-") { Write-Warning "Publishing a pre-release version ($version) to the Stable channel." }
          # Release notes: this version's section of CHANGELOG_UWX.md.
          $lines = Get-Content "CHANGELOG_UWX.md"
          $start = ($lines | Select-String -Pattern ("^## " + [regex]::Escape($version)) | Select-Object -First 1).LineNumber
          $notes = if ($start) {
            $rest = $lines[$start..($lines.Length - 1)]
            $next = ($rest | Select-String -Pattern "^## " | Select-Object -First 1).LineNumber
            if ($next) { $rest[0..($next - 2)] } else { $rest }
          } else { @("UnderWeb X $version") }
          $notes -join "`n" | Set-Content -Path release-notes.md -Encoding utf8
          $files = @($setup.FullName, "SHA256SUMS.txt")
          if ($zip) { $files += $zip.FullName }
          $flag = if ($env:CHANNEL -eq "beta") { "--prerelease" } else { "--latest" }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release $tag already exists. Bump the version before publishing again." }
          gh release create $tag @files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "UnderWeb X $tag" --notes-file release-notes.md $flag
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed." }
          Write-Host "Published $tag ($env:CHANNEL)"
